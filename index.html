<!DOCTYPE html>
<html>
<head>
  <title>Auto Love Chat 💖</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b141a;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 15px;
      font-weight: bold;
      text-align: center;
    }

    .music {
      text-align: center;
      margin: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      background: #00a884;
      color: white;
    }

    .chat {
      padding: 10px;
      height: 75vh;
      overflow-y: auto;
    }

    .msg {
      max-width: 75%;
      padding: 10px;
      margin: 8px;
      border-radius: 10px;
      font-size: 14px;
      clear: both;
      opacity: 0;
      animation: fade 0.3s forwards;
    }

    .me {
      background: #005c4b;
      color: white;
      float: right;
    }

    .you {
      background: #202c33;
      color: white;
      float: left;
    }

    @keyframes fade {
      to { opacity: 1; }
    }
  </style>
</head>

<body>

<div class="header">lurveechatStory</div>

<!-- 🎵 MUSIC -->
<div class="music">
  <button onclick="playMusic()">▶ Play Music</button>
</div>

<iframe id="music" width="0" height="0"
src="https://www.youtube.com/embed/LtZi0ZSurUQ?loop=1&playlist=LtZi0ZSurUQ"
allow="autoplay">
</iframe>

<div class="chat" id="chat"></div>

<script>
let chat = document.getElementById("chat");

function addMsg(text, type, delay) {
  setTimeout(() => {
    let msg = document.createElement("div");
    msg.className = "msg " + type;
    msg.innerText = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }, delay);
}

// 💬 STORY START
addMsg("haii raraa", "me", 1000);
addMsg("hi", "you", 2500);

addMsg("tengah buat apa tu?", "me", 4000);
addMsg("knp", "you", 6000);

addMsg("saya nak cakapp sikitt", "me", 8000);

// 💔 LONG EMOTIONAL TEXT
addMsg("ive been thinking about this for a while, and i guess i finally have the courage to say it.", "me", 10000);
addMsg("thank you for being a really good ex to me.", "me", 12000);
addMsg("i never hated you. i just appreciate what we had.", "me", 14000);
addMsg("i miss you quietly, not in a loud way.", "me", 16000);
addMsg("sometimes memories of us still come back.", "me", 18000);
addMsg("even though we dont talk anymore, i accept it now.", "me", 20000);
addMsg("i hope youre okay. truly okay.", "me", 22000);
addMsg("i hope youre happy, smiling, and doing well in life.", "me", 24000);
addMsg("you deserve someone who treats you better than i could.", "me", 26000);
addMsg("and i genuinely wish you the best, always.", "me", 28000);
addMsg("as for me. im learning to move on slowly.", "me", 30000);
addMsg("but i will always remember you softly, without anger.", "me", 32000);
addMsg("thank you for everything", "me"", 34000);

addMsg("i just want you to be happy, always.", "me", 36000);

// 🎵 MUSIC FUNCTION
function playMusic() {
  document.getElementById("music").src =
  "https://www.youtube.com/embed/LtZi0ZSurUQ?autoplay=1&loop=1&playlist=LtZi0ZSurUQ";
}
</script>

</body>
</html>
